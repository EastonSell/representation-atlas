<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Translation, projection and a fixed downstream readout</title><desc id="desc">Translating A=(1,0) and B=(0,1) by (2,2) keeps their distance at square root of two but changes cosine from zero to twelve-thirteenths. Removing the vertical direction merges differently labelled points (1,1) and (1,-1). A fixed score x1 minus 0.5 changes from 0.5 and -0.5 to 2.5 and 1.5 after translation; changing its bias to -2.5 separately restores the original scores. These are illustrative mathematics, not model-study evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#596f80"/></marker></defs>
<rect width="1200" height="920" fill="#f5f8fb"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="32" font-weight="700" fill="#172b3a">Geometry is not the same as model behavior</text><text x="40" y="80" font-size="18" font-weight="400" fill="#172b3a">ILLUSTRATION ONLY · No pretrained model, fitted PCA or new benchmark evidence.</text><rect x="40" y="105" width="350" height="385" rx="16" fill="#ffffff" stroke="#c9d5df"/><rect x="410" y="105" width="350" height="385" rx="16" fill="#ffffff" stroke="#c9d5df"/><rect x="780" y="105" width="380" height="385" rx="16" fill="#ffffff" stroke="#c9d5df"/><text x="62" y="141" font-size="21" font-weight="700" fill="#172b3a">1. Original coordinates</text><text x="432" y="141" font-size="21" font-weight="700" fill="#172b3a">2. Add (2, 2) to both</text><text x="802" y="141" font-size="20" font-weight="700" fill="#172b3a">3. Discard vertical direction</text><path d="M127,375 V190 M82,330 H302" stroke="#dde5ec" stroke-width="1"/><path d="M172,375 V190 M82,285 H302" stroke="#dde5ec" stroke-width="1"/><path d="M217,375 V190 M82,240 H302" stroke="#dde5ec" stroke-width="1"/><path d="M262,375 V190 M82,195 H302" stroke="#dde5ec" stroke-width="1"/><path d="M82,375 L317,375" stroke="#596f80" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><path d="M82,375 L82,180" stroke="#596f80" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="69" y="399" font-size="15" font-weight="400" fill="#172b3a">0</text><text x="325" y="382" font-size="16" font-weight="400" fill="#172b3a">x</text><text x="76" y="168" font-size="16" font-weight="400" fill="#172b3a">y</text><path d="M82,375 L127,375" stroke="#768d9e" stroke-width="2" stroke-dasharray="4 4"/><circle cx="127" cy="375" r="6" fill="#0969a2"/><text x="138" y="363" font-size="17" font-weight="700" fill="#172b3a">A (1, 0)</text><path d="M82,375 L82,330" stroke="#768d9e" stroke-width="2" stroke-dasharray="4 4"/><rect x="76" y="324" width="12" height="12" fill="#9d4b00"/><text x="93" y="318" font-size="17" font-weight="700" fill="#172b3a">B (0, 1)</text><path d="M127,375 L82,330" stroke="#304b5d" stroke-width="2"/><path d="M497,375 V190 M452,330 H672" stroke="#dde5ec" stroke-width="1"/><path d="M542,375 V190 M452,285 H672" stroke="#dde5ec" stroke-width="1"/><path d="M587,375 V190 M452,240 H672" stroke="#dde5ec" stroke-width="1"/><path d="M632,375 V190 M452,195 H672" stroke="#dde5ec" stroke-width="1"/><path d="M452,375 L687,375" stroke="#596f80" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><path d="M452,375 L452,180" stroke="#596f80" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="439" y="399" font-size="15" font-weight="400" fill="#172b3a">0</text><text x="695" y="382" font-size="16" font-weight="400" fill="#172b3a">x</text><text x="446" y="168" font-size="16" font-weight="400" fill="#172b3a">y</text><path d="M452,375 L587,285" stroke="#768d9e" stroke-width="2" stroke-dasharray="4 4"/><circle cx="587" cy="285" r="6" fill="#0969a2"/><text x="598" y="273" font-size="17" font-weight="700" fill="#172b3a">A (3, 2)</text><path d="M452,375 L542,240" stroke="#768d9e" stroke-width="2" stroke-dasharray="4 4"/><rect x="536" y="234" width="12" height="12" fill="#9d4b00"/><text x="553" y="228" font-size="17" font-weight="700" fill="#172b3a">B (2, 3)</text><path d="M587,285 L542,240" stroke="#304b5d" stroke-width="2"/><text x="62" y="432" font-size="20" font-weight="400" fill="#172b3a">Distance = √2</text><text x="62" y="462" font-size="20" font-weight="400" fill="#172b3a">Cosine = 0</text><text x="432" y="432" font-size="20" font-weight="400" fill="#172b3a">Distance = √2, unchanged</text><text x="432" y="462" font-size="20" font-weight="400" fill="#172b3a">Cosine = 12/13 ≈ 0.923</text><text x="802" y="190" font-size="18" font-weight="400" fill="#172b3a">Labels differ by the sign of y:</text><text x="815" y="238" font-size="19" font-weight="700" fill="#0969a2">(1, 1): positive</text><text x="815" y="285" font-size="19" font-weight="700" fill="#9d4b00">(1, −1): negative</text><path d="M950,306 L950,345" stroke="#596f80" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><text x="829" y="382" font-size="22" font-weight="700" fill="#172b3a">Both become (1, 0).</text><text x="802" y="432" font-size="18" font-weight="400" fill="#172b3a">Distance: 2 → 0</text><text x="802" y="462" font-size="18" font-weight="400" fill="#172b3a">The label cannot be recovered.</text><rect x="40" y="520" width="1120" height="282" rx="16" fill="#eaf2f8" stroke="#c9d5df"/><text x="64" y="560" font-size="23" font-weight="700" fill="#172b3a">Inside a fixed model: the downstream readout does not move with the points.</text><text x="64" y="596" font-size="20" font-weight="400" fill="#172b3a">Score = x1 − 0.5. A zero threshold separates original A and B.</text><text x="64" y="645" font-size="19" font-weight="700" fill="#172b3a">Original states</text><text x="430" y="645" font-size="19" font-weight="700" fill="#172b3a">Shifted, fixed readout</text><text x="815" y="645" font-size="18" font-weight="700" fill="#172b3a">Shifted, adjusted readout</text><text x="64" y="684" font-size="21" font-weight="400" fill="#172b3a">A: +0.5    B: −0.5</text><text x="430" y="684" font-size="21" font-weight="400" fill="#172b3a">A: +2.5    B: +1.5</text><text x="815" y="684" font-size="21" font-weight="400" fill="#172b3a">A: +0.5    B: −0.5</text><text x="64" y="729" font-size="18" font-weight="400" fill="#172b3a">Original decisions</text><text x="430" y="729" font-size="18" font-weight="700" fill="#172b3a">B changes decision</text><text x="815" y="729" font-size="18" font-weight="700" fill="#172b3a">Bias is now −2.5</text><text x="64" y="773" font-size="18" font-weight="400" fill="#172b3a">Compensating the readout is a second operation. Distance invariance alone is not behavior invariance.</text><text x="40" y="847" font-size="19" font-weight="400" fill="#172b3a">Centering is a translation; projection can lose information.</text><text x="40" y="877" font-size="19" font-weight="400" fill="#172b3a">A model-state swap is an intervention. Its outcome must be measured, not inferred from a geometry plot.</text></g></svg>
